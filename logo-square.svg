<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="squareGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="accentSqGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="100" fill="url(#squareGradient)"/>

  <!-- Main icon content centered -->
  <g transform="translate(256, 256)">
    <!-- Magnifying glass circle -->
    <circle cx="-40" cy="-40" r="140" fill="white" opacity="0.25"/>

    <!-- Pin/magnifying glass combo -->
    <circle cx="-40" cy="-40" r="100" fill="white" opacity="0.9"/>

    <!-- Pin inside -->
    <g transform="translate(-40, -40)">
      <circle cx="0" cy="0" r="35" fill="url(#squareGradient)"/>
      <circle cx="0" cy="-18" r="18" fill="white"/>
      <path d="M0,18 L0,50" stroke="white" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Handle -->
    <rect x="90" y="90" width="30" height="90" rx="15" fill="url(#accentSqGradient)"
          transform="rotate(45, 90, 90)"/>

    <!-- Shopping accent -->
    <g transform="translate(100, -60)">
      <rect x="-25" y="-18" width="50" height="45" rx="8" fill="url(#accentSqGradient)"/>
      <path d="M-18,-18 Q-18,-30 0,-30 Q18,-30 18,-18" stroke="white" stroke-width="4" fill="none"/>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="20" font-weight="bold"
            fill="white" text-anchor="middle">$</text>
    </g>
  </g>

  <!-- Shine effects -->
  <circle cx="380" cy="100" r="15" fill="white" opacity="0.3"/>
  <circle cx="120" cy="400" r="10" fill="white" opacity="0.2"/>
</svg>